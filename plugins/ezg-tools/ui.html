<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Corner Profiles</title>
    <style>
      /* plugins/ezg-tools/src/ui/styles/base.css */
:root {
  color-scheme: light;
  --cp-focus: var(--figma-color-border-selected, #0d99ff);
  --cp-title-height: 40px;
}
:root.figma-dark {
  color-scheme: dark;
}
*,
*::before,
*::after {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  padding: 0;
  overflow: hidden;
}
body {
  background: var(--figma-color-bg, #fff);
  color: var(--figma-color-text, #1e1e1e);
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    sans-serif;
  font-size: 11px;
  line-height: 16px;
  letter-spacing: 0.005em;
  -webkit-font-smoothing: antialiased;
}
button,
input {
  margin: 0;
  font: inherit;
  letter-spacing: inherit;
  color: inherit;
}
[hidden] {
  display: none !important;
}

/* plugins/ezg-tools/src/ui/styles/layout.css */
#plugin-root {
  display: grid;
  grid-template-columns: var(--rail-width) minmax(0, 1fr);
  width: 100%;
}
.cp-group {
  padding: 0 0 12px;
  border-bottom: 1px solid var(--figma-color-border, #e6e6e6);
}
.cp-group-title {
  display: flex;
  align-items: center;
  height: var(--cp-title-height);
  margin: 0;
  padding: 0 12px;
  font-size: inherit;
  font-weight: 550;
  color: var(--figma-color-text, #1e1e1e);
}
.cp-tool-title {
  border-bottom: 1px solid var(--figma-color-border, #e6e6e6);
}
.cp-block {
  padding: 0 12px;
}
.cp-title-row {
  height: 40px;
  font-weight: 550;
}
.cp-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 24px;
}
.cp-field {
  display: grid;
  grid-template-columns: 72px minmax(0, 1fr) 48px;
  align-items: center;
  column-gap: 8px;
  min-height: 32px;
  padding: 0 12px;
}
.cp-field > label {
  color: var(--figma-color-text-secondary, #666);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cp-field > .cp-switch {
  justify-self: start;
}
.cp-caption {
  color: var(--figma-color-text-secondary, #666);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.cp-empty {
  margin: 0 0 4px;
  color: var(--figma-color-text-tertiary, #999);
}

/* plugins/ezg-tools/src/ui/styles/rail.css */
.cp-rail {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 8px 0 0 4px;
}
.cp-tab {
  appearance: none;
  position: relative;
  z-index: 1;
  display: grid;
  place-items: center;
  height: var(--tab-height);
  padding: 0;
  margin-right: -1px;
  border: 1px solid transparent;
  border-right: 0;
  border-radius: 5px 0 0 5px;
  background: transparent;
  color: var(--figma-color-icon-secondary, #666);
  outline: none;
  cursor: default;
}
.cp-tab-end {
  margin-top: auto;
  margin-bottom: 4px;
}
.cp-tab:hover {
  color: var(--figma-color-icon, #2c2c2c);
}
.cp-tab[aria-selected=true] {
  border-color: var(--figma-color-border, #e6e6e6);
  background: var(--figma-color-bg, #fff);
  color: var(--figma-color-icon, #2c2c2c);
}
.cp-tab:focus-visible {
  box-shadow: inset 0 0 0 1px var(--figma-color-border-selected, #0d99ff);
}
.cp-rail {
  overflow: hidden;
}
.cp-tool {
  min-width: 0;
  max-height: 100vh;
  overflow-y: auto;
  border-left: 1px solid var(--figma-color-border, #e6e6e6);
}
.cp-tool-title {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--figma-color-bg, #fff);
}

/* plugins/ezg-tools/src/ui/styles/buttons.css */
.cp-btn {
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 24px;
  padding: 0 8px;
  border: 0;
  border-radius: 5px;
  background: var(--figma-color-bg-brand, #0d99ff);
  color: var(--figma-color-text-onbrand, #fff);
  font-weight: 500;
  white-space: nowrap;
  outline: none;
  cursor: default;
  user-select: none;
  -webkit-user-select: none;
}
.cp-btn:enabled:hover {
  background: var(--figma-color-bg-brand-hover, #0a8ae6);
}
.cp-btn:enabled:active {
  background: var(--figma-color-bg-brand-pressed, #007be5);
}
.cp-btn:focus-visible {
  outline: 1px solid var(--cp-focus);
  outline-offset: 1px;
}
.cp-btn:disabled {
  background: var(--figma-color-bg-disabled, #d9d9d9);
  color: var(--figma-color-text-ondisabled, #fff);
}
.cp-btn.secondary,
.cp-btn.ghost {
  background: transparent;
  color: var(--figma-color-text, #1e1e1e);
}
.cp-btn.secondary {
  box-shadow: inset 0 0 0 1px var(--figma-color-border, #e6e6e6);
}
.cp-btn.secondary:enabled:hover,
.cp-btn.ghost:enabled:hover {
  background: var(--figma-color-bg-hover, #f5f5f5);
}
.cp-btn.secondary:enabled:active,
.cp-btn.ghost:enabled:active {
  background: var(--figma-color-bg-pressed, #e6e6e6);
}
.cp-btn.secondary:disabled,
.cp-btn.ghost:disabled {
  background: transparent;
  color: var(--figma-color-text-disabled, #b3b3b3);
}
.cp-btn.secondary:disabled {
  box-shadow: inset 0 0 0 1px var(--figma-color-border-disabled, #e6e6e6);
}
.cp-btn.cp-active,
.cp-btn.cp-active:enabled:hover {
  background: var(--figma-color-bg-selected, #e5f4ff);
  box-shadow: inset 0 0 0 1px var(--figma-color-border-selected, #0d99ff);
  color: var(--figma-color-text, #1e1e1e);
}
.cp-icon-btn {
  appearance: none;
  display: inline-flex;
  flex: none;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  padding: 0;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: var(--figma-color-icon, #2c2c2c);
  outline: none;
  cursor: default;
  user-select: none;
  -webkit-user-select: none;
}
.cp-icon-btn:enabled:hover {
  background: var(--figma-color-bg-hover, #f5f5f5);
}
.cp-icon-btn:enabled:active {
  background: var(--figma-color-bg-pressed, #e6e6e6);
}
.cp-icon-btn[aria-pressed=true],
.cp-icon-btn[aria-pressed=true]:enabled:hover {
  background: var(--figma-color-bg-selected, #e5f4ff);
  color: var(--figma-color-icon-brand, #0d99ff);
}
.cp-icon-btn:focus-visible {
  box-shadow: inset 0 0 0 1px var(--figma-color-border-selected, #0d99ff);
}
.cp-icon-btn:disabled {
  opacity: 0.4;
}

/* plugins/ezg-tools/src/ui/styles/inputs.css */
input[type=text],
input[type=number] {
  appearance: none;
  -moz-appearance: textfield;
  width: 100%;
  min-width: 0;
  height: 24px;
  padding: 0 7px;
  border: 1px solid transparent;
  border-radius: 5px;
  background: var(--figma-color-bg-secondary, #f5f5f5);
  color: var(--figma-color-text, #1e1e1e);
  outline: none;
}
input[type=text]:hover,
input[type=number]:hover {
  border-color: var(--figma-color-border, #e6e6e6);
}
input[type=text]:focus,
input[type=number]:focus {
  border-color: var(--figma-color-border-selected, #0d99ff);
}
input::placeholder {
  color: var(--figma-color-text-tertiary, #b3b3b3);
}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button {
  -webkit-appearance: none;
  margin: 0;
}
input:disabled {
  color: var(--figma-color-text-disabled, #b3b3b3);
}

/* plugins/ezg-tools/src/ui/styles/slider.css */
input[type=range] {
  --track: var(--figma-color-bg-tertiary, #e6e6e6);
  --active: var(--figma-color-bg-brand, #0d99ff);
  --stop: calc(6px + (100% - 12px) * var(--fill, 0));
  appearance: none;
  -webkit-appearance: none;
  width: 100%;
  min-width: 0;
  height: 16px;
  background: transparent;
  outline: none;
}
input[type=range]::-webkit-slider-runnable-track {
  height: 4px;
  border-radius: 2px;
  background:
    linear-gradient(
      to right,
      var(--active) var(--stop),
      var(--track) var(--stop));
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px;
  height: 12px;
  margin-top: -4px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.15), 0 1px 3px rgba(0, 0, 0, 0.3);
}
input[type=range]:focus-visible::-webkit-slider-thumb {
  box-shadow: 0 0 0 2px var(--cp-focus);
}
input[type=range]::-moz-range-track {
  height: 4px;
  border-radius: 2px;
  background: var(--track);
}
input[type=range]::-moz-range-progress {
  height: 4px;
  border-radius: 2px;
  background: var(--active);
}
input[type=range]::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border: 0;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.15), 0 1px 3px rgba(0, 0, 0, 0.3);
}
input[type=range]:focus-visible::-moz-range-thumb {
  box-shadow: 0 0 0 2px var(--cp-focus);
}

/* plugins/ezg-tools/src/ui/styles/scrub.css */
.cp-scrub {
  display: flex;
  align-items: center;
  gap: 4px;
  height: 24px;
  min-width: 0;
  padding: 0 6px;
  border-radius: 4px;
  background: var(--figma-color-bg-secondary, #f5f5f5);
}
.cp-scrub > span {
  color: var(--figma-color-text-secondary, #666);
  font-size: 11px;
  user-select: none;
}
.cp-scrub input {
  flex: 1;
  min-width: 0;
  height: 100%;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--figma-color-text, #333);
  font: inherit;
  text-align: right;
  cursor: ew-resize;
  outline: none;
}
.cp-scrub input:focus {
  cursor: text;
}
.cp-scrub input:disabled {
  cursor: default;
  color: var(--figma-color-text-disabled, #b3b3b3);
}
.cp-scrub input.cp-scrubbing {
  cursor: ew-resize;
}
.cp-scrub:focus-within {
  box-shadow: inset 0 0 0 1px var(--figma-color-border-selected, #0d99ff);
}

/* plugins/ezg-tools/src/ui/styles/radius.css */
.cp-radius-row,
.cp-radius-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 24px;
  column-gap: 8px;
  row-gap: 8px;
  padding: 0 12px;
  align-items: center;
}
.cp-radius-row {
  min-height: 32px;
}
.cp-radius-grid {
  margin-top: 8px;
}
.cp-radius-grid[hidden],
#asym-panel[hidden] {
  display: none;
}
.cp-radius-grid > .cp-num:nth-of-type(odd) {
  grid-column: 1;
}
.cp-radius-grid > .cp-num:nth-of-type(even) {
  grid-column: 2;
}
#radius-more {
  grid-row: 2;
  grid-column: 3;
}
#asym-panel {
  margin-top: 8px;
}
.cp-num {
  display: flex;
  align-items: center;
  height: 24px;
  border-radius: 5px;
  border: 1px solid transparent;
  background: var(--figma-color-bg-secondary, #f5f5f5);
  min-width: 0;
}
.cp-num:hover {
  border-color: var(--figma-color-border);
}
.cp-num:focus-within {
  border-color: var(--figma-color-border-selected);
}
.cp-num-icon {
  display: flex;
  flex: none;
  width: 16px;
  height: 16px;
  margin: 0 4px;
  color: var(--figma-color-icon-secondary, #666);
  cursor: ew-resize;
  user-select: none;
}
.cp-num input {
  flex: 1;
  min-width: 0;
  height: 100%;
  padding: 0 4px 0 0;
  background: transparent;
  border: 0;
  box-shadow: none;
}

/* plugins/ezg-tools/src/ui/styles/switch.css */
.cp-switch {
  appearance: none;
  -webkit-appearance: none;
  position: relative;
  flex: none;
  width: 24px;
  height: 14px;
  border-radius: 7px;
  background: var(--figma-color-icon-tertiary, #b3b3b3);
  outline: none;
  cursor: default;
  transition: background-color 0.12s ease;
}
.cp-switch::before {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--figma-color-icon-onbrand, #fff);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
  transition: transform 0.12s ease;
}
.cp-switch:checked {
  background: var(--figma-color-bg-brand, #0d99ff);
}
.cp-switch:checked::before {
  transform: translateX(10px);
}
.cp-switch:focus-visible {
  outline: 1px solid var(--cp-focus);
  outline-offset: 1px;
}
.cp-switch:disabled {
  opacity: 0.4;
}

/* plugins/ezg-tools/src/ui/styles/shape.css */
.cp-shape {
  display: block;
  margin-top: 4px;
  border-radius: 5px;
  background: var(--figma-color-bg-secondary, #f5f5f5);
  user-select: none;
  -webkit-user-select: none;
}
.cp-shape .s-bounds {
  fill: none;
  stroke: var(--figma-color-border, #e6e6e6);
  stroke-dasharray: 2 2;
}
.cp-shape .s-shape {
  fill: var(--figma-color-bg-tertiary, #e6e6e6);
  stroke: var(--figma-color-border-strong, #2c2c2c);
  stroke-width: 1;
  vector-effect: non-scaling-stroke;
}
.cp-shape .s-edge {
  fill: none;
  stroke: var(--figma-color-border-strong, #2c2c2c);
  stroke-width: 2;
  vector-effect: non-scaling-stroke;
}
.cp-shape .s-hot {
  cursor: pointer;
  outline: none;
}
.cp-shape .s-hit {
  fill: transparent;
}
.cp-shape .s-dot {
  fill: var(--figma-color-bg, #fff);
  stroke: var(--figma-color-border-strong, #2c2c2c);
  stroke-width: 1;
}
.cp-shape .s-hot:hover .s-dot {
  stroke: var(--figma-color-bg-brand, #0d99ff);
}
.cp-shape .s-hot.is-on .s-dot {
  fill: var(--figma-color-bg-brand, #0d99ff);
  stroke: var(--figma-color-bg-brand, #0d99ff);
}
.cp-shape .s-hot:focus-visible .s-dot {
  stroke: var(--figma-color-border-selected-strong, #0d99ff);
  stroke-width: 2;
}
.cp-shape .s-bracket {
  fill: none;
  stroke: var(--figma-color-bg-brand, #0d99ff);
  stroke-width: 2;
  stroke-linecap: round;
}

/* plugins/ezg-tools/src/ui/styles/thumbs.css */
.cp-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}
.cp-thumb {
  all: unset;
  box-sizing: border-box;
  position: relative;
  display: grid;
  place-items: center;
  width: 100%;
  height: 34px;
  border-radius: 5px;
  background: var(--figma-color-bg-secondary, #f5f5f5);
  box-shadow: inset 0 0 0 1px transparent;
  color: var(--figma-color-icon, #2c2c2c);
  cursor: default;
}
.cp-thumb:hover {
  background: var(--figma-color-bg-hover, #ededed);
}
.cp-thumb:active {
  background: var(--figma-color-bg-tertiary, #e6e6e6);
}
.cp-thumb[aria-pressed=true] {
  background: var(--figma-color-bg-selected, #e5f4ff);
  box-shadow: inset 0 0 0 1px var(--figma-color-border-selected, #0d99ff);
  color: var(--figma-color-icon-brand, #0d99ff);
}
.cp-thumb:focus-visible {
  box-shadow: inset 0 0 0 2px var(--figma-color-border-selected, #0d99ff);
}
.cp-thumb svg {
  display: block;
  width: 22px;
  height: 22px;
  overflow: visible;
}
.cp-thumb .t-fill {
  fill: var(--figma-color-bg-tertiary, #e6e6e6);
}
.cp-thumb[aria-pressed=true] .t-fill {
  fill: var(--figma-color-bg-selected-strong, #bde3ff);
}
.cp-thumb .t-line {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.25;
  vector-effect: non-scaling-stroke;
  stroke-linejoin: round;
}

/* plugins/ezg-tools/src/ui/styles/saved.css */
.cp-saved-head {
  margin-top: 8px;
}
.cp-saved {
  margin-top: 4px;
}
.cp-saved-item {
  position: relative;
}
.cp-del {
  all: unset;
  box-sizing: border-box;
  position: absolute;
  top: -5px;
  right: -5px;
  width: 14px;
  height: 14px;
  border-radius: 7px;
  display: grid;
  place-items: center;
  background: var(--figma-color-bg, #fff);
  color: var(--figma-color-icon-secondary, #666);
  box-shadow: 0 0 0 1px var(--figma-color-border-strong, #2c2c2c);
  opacity: 0;
  cursor: default;
}
.cp-saved-item:hover .cp-del,
.cp-saved-item:focus-within .cp-del {
  opacity: 1;
}
.cp-del:hover {
  color: var(--figma-color-icon-danger, #f24822);
}
.cp-del:focus-visible {
  opacity: 1;
  box-shadow: 0 0 0 2px var(--cp-focus);
}
.cp-del svg {
  width: 8px;
  height: 8px;
  display: block;
}
.cp-del path {
  stroke: currentColor;
  stroke-width: 1.25;
  fill: none;
  stroke-linecap: round;
}
.cp-save-row {
  display: flex;
  gap: 4px;
  align-items: center;
  margin: 4px 0;
}
.cp-save-row input {
  flex: 1 1 auto;
}
.cp-save-row .cp-btn {
  flex: 0 0 auto;
}

/* plugins/ezg-tools/src/ui/styles/editor.css */
.cp-editor-wrap {
  width: fit-content;
  margin: 0 auto;
  border-radius: 5px;
  outline: none;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.cp-editor-wrap:focus-visible {
  box-shadow: 0 0 0 2px var(--figma-color-border-selected, #0d99ff);
}
#editor {
  display: block;
}
#editor .e-bg {
  fill: var(--figma-color-bg-secondary, #f5f5f5);
}
#editor .e-grid {
  fill: none;
  stroke: var(--figma-color-border, #e6e6e6);
  stroke-width: 1;
}
#editor .e-material {
  fill: var(--figma-color-bg-brand-tertiary, #e5f4ff);
}
#editor .e-edge {
  fill: none;
  stroke: var(--figma-color-border-strong, #2c2c2c);
  stroke-width: 1;
  stroke-dasharray: 3 3;
}
#editor .e-curve {
  fill: none;
  stroke: var(--figma-color-icon, #2c2c2c);
  stroke-width: 1.5;
  stroke-linejoin: round;
}
#editor .e-curve.is-none {
  stroke: var(--figma-color-icon-tertiary, #b3b3b3);
  stroke-dasharray: 4 3;
}
#editor .e-hline {
  stroke: var(--figma-color-bg-brand, #0d99ff);
  stroke-width: 1;
}
#editor .e-handle {
  fill: var(--figma-color-bg, #fff);
  stroke: var(--figma-color-bg-brand, #0d99ff);
  stroke-width: 1.5;
}
#editor .e-anchor {
  fill: var(--figma-color-bg, #fff);
  stroke: var(--figma-color-icon, #2c2c2c);
  stroke-width: 1.5;
}
#editor .e-anchor.is-end {
  fill: var(--figma-color-icon-tertiary, #b3b3b3);
}
#editor .e-anchor.is-selected {
  fill: var(--figma-color-bg-brand, #0d99ff);
  stroke: var(--figma-color-bg-brand, #0d99ff);
}
.cp-toolbar {
  display: flex;
  align-items: center;
  gap: 4px;
  width: 260px;
  margin: 4px auto 0;
}
.cp-seg {
  display: flex;
  flex: none;
  border-radius: 5px;
  background: var(--figma-color-bg-secondary, #f5f5f5);
}
.cp-seg .cp-icon-btn {
  border-radius: 0;
}
.cp-seg .cp-icon-btn:first-child {
  border-radius: 5px 0 0 5px;
}
.cp-seg .cp-icon-btn:last-child {
  border-radius: 0 5px 5px 0;
}
.cp-toolbar .cp-scrub {
  flex: 1 1 0;
  min-width: 0;
}

/* plugins/ezg-tools/src/ui/styles/footer.css */
.cp-footer {
  position: sticky;
  bottom: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 12px;
  background: var(--figma-color-bg, #fff);
}
.cp-footer-row {
  display: flex;
  align-items: center;
