name: release

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "ezg-figma-tools commit"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: namdseasygoingvn/ezg-figma-tools
          ref: ${{ inputs.sha }}
          token: ${{ secrets.EZG_PAT }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: main
          path: dist-repo
          fetch-depth: 0

      - name: Build release
        env:
          EZG_ICON_TAGS_PRUNE_KEY: ${{ secrets.EZG_ICON_TAGS_PRUNE_KEY }}
        run: |
          V=$(node scripts/next-version.mjs dist-repo/version.json $(git -C dist-repo tag -l "v*"))
          echo "VERSION=$V" >> "$GITHUB_ENV"
          node scripts/release.mjs --version "$V" --out release

      - name: Publish to dist repo
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          # --checksum: a same-size file (0.1.4 -> 0.1.5) must not be skipped by rsync's size+mtime check.
          rsync -a --checksum --delete --exclude .git --exclude .github --exclude README.md release/ dist-repo/
          diff -r --exclude .git --exclude .github --exclude README.md release dist-repo
          cd dist-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release v$VERSION (ezg-figma-tools@${INPUT_SHA::7})"
          git tag "v$VERSION"
          git push origin main --tags
